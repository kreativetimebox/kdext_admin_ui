version: '3.8'

services:
  manual-analyzer:
    build: .
    container_name: manual-analyzer
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - HOSTNAME=0.0.0.0
      - DEXAI_DB_URL=${DEXAI_DB_URL}
      # Connect to financedb-postgres using container name (requires same network)
      - MAIN_FINANCE_DB_URL=postgresql://postgres:financedb_secure_pass_2025@financedb-postgres:5432/financedb
      # Same broker as the Gateway — used to publish document.corrected on HITL publish.
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_EVENTS_EXCHANGE=${RABBITMQ_EVENTS_EXCHANGE:-document.events}
      - JWT_SECRET=${JWT_SECRET}
      # Current/default bucket
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_REGION=${AWS_REGION}
      # Legacy bucket (older documents, different IAM key/region)
      - AWS_LEGACY_BUCKET_NAME=${AWS_LEGACY_BUCKET_NAME}
      - AWS_LEGACY_REGION=${AWS_LEGACY_REGION}
      - AWS_LEGACY_ACCESS_KEY_ID=${AWS_LEGACY_ACCESS_KEY_ID}
      - AWS_LEGACY_SECRET_ACCESS_KEY=${AWS_LEGACY_SECRET_ACCESS_KEY}
    networks:
      - financedb_network
    restart: always

networks:
  # Reference the network created by financedb docker-compose
  financedb_network:
    external: true