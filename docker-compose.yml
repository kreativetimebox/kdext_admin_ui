version: '3.8'

services:
  manual-analyzer:
    build: .
    container_name: manual-analyzer
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - HOSTNAME=0.0.0.0
      - DEXAI_DB_URL=${DEXAI_DB_URL}
      # Connect to financedb-postgres using container name (requires same network)
      - MAIN_FINANCE_DB_URL=postgresql://postgres:financedb_secure_pass_2025@financedb-postgres:5432/financedb
      # Same broker as the Gateway — used to publish document.corrected on HITL publish.
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_EVENTS_EXCHANGE=${RABBITMQ_EVENTS_EXCHANGE:-document.events}
      - JWT_SECRET=${JWT_SECRET}
      # Current/default bucket
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_REGION=${AWS_REGION}
      # Legacy bucket (older documents, different IAM key/region)
      - AWS_LEGACY_BUCKET_NAME=${AWS_LEGACY_BUCKET_NAME}
      - AWS_LEGACY_REGION=${AWS_LEGACY_REGION}
      - AWS_LEGACY_ACCESS_KEY_ID=${AWS_LEGACY_ACCESS_KEY_ID}
      - AWS_LEGACY_SECRET_ACCESS_KEY=${AWS_LEGACY_SECRET_ACCESS_KEY}
      # Alerts tab — background error monitor + email notifications (lib/alertMonitor.js)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO}
      - ALERT_POLL_INTERVAL_MS=${ALERT_POLL_INTERVAL_MS:-30000}
      - ALERT_WATCHED_CONTAINERS=${ALERT_WATCHED_CONTAINERS:-lightonocr,kdext-qwen,kdext-document-api,kdext-api,kdext-worker,kdext-webhook-worker}
      - ALERT_CPU_WARNING_THRESHOLD=${ALERT_CPU_WARNING_THRESHOLD:-75}
      - ALERT_CPU_THRESHOLD=${ALERT_CPU_THRESHOLD:-90}
      - ALERT_MEM_WARNING_THRESHOLD=${ALERT_MEM_WARNING_THRESHOLD:-75}
      - ALERT_MEM_THRESHOLD=${ALERT_MEM_THRESHOLD:-90}
      - ALERT_DISK_WARNING_THRESHOLD=${ALERT_DISK_WARNING_THRESHOLD:-75}
      - ALERT_DISK_THRESHOLD=${ALERT_DISK_THRESHOLD:-90}
      - ALERT_GPU_TEMP_WARNING_THRESHOLD=${ALERT_GPU_TEMP_WARNING_THRESHOLD:-75}
      - ALERT_GPU_TEMP_THRESHOLD=${ALERT_GPU_TEMP_THRESHOLD:-85}
      - ALERT_LOG_TAIL_LINES=${ALERT_LOG_TAIL_LINES:-200}
      - ALERT_RENOTIFY_MINUTES=${ALERT_RENOTIFY_MINUTES:-60}
    networks:
      - financedb_network
    restart: always

networks:
  # Reference the network created by financedb docker-compose
  financedb_network:
    external: true