name: Deploy

# Fast deploy (same pattern as kdext_api): instead of building the image on the
# runner and shipping a large image.tar over SCP, we ship only the source over
# SSH and build + run the image on the server. The server's Docker layer cache
# makes rebuilds quick. Secrets come from repo secrets; host/DB are chosen by branch.
on:
  push:
    branches:
      - main
      - master
      - production_h200
  workflow_dispatch:

env:
  SSH_PORT: "22"
  SSH_USER: balabantaray-user
  REMOTE_DIR: /home/balabantaray-user/kdext
  APP_NAME: kdext_manual_anaylizer
  APP_PORT: "3004"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set deployment target based on branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/production_h200" ]; then
            echo "SSH_HOST=217.16.188.48" >> $GITHUB_ENV
            echo "DB_HOST=217.16.188.48" >> $GITHUB_ENV
            echo "MAIN_FINANCE_DB_URL=postgresql://financedb_user:financedb_password_2026@217.16.188.48:5005/financedb" >> $GITHUB_ENV
            echo "SERVER=H200 (New Server)" >> $GITHUB_ENV
          else
            echo "SSH_HOST=185.14.252.37" >> $GITHUB_ENV
            echo "DB_HOST=185.14.252.37" >> $GITHUB_ENV
            echo "MAIN_FINANCE_DB_URL=postgresql://financedb_user:financedb_password_2026@185.14.252.37:5005/financedb" >> $GITHUB_ENV
            echo "SERVER=RTX5000 (Main Server)" >> $GITHUB_ENV
          fi
          echo "Deploying to $SERVER"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VAST_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload code to server
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p $REMOTE_DIR"
          tar czf - \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env*' \
            . | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
                "tar xzf - -C $REMOTE_DIR"

      - name: Build & restart
        run: |
          DB_HOST_VALUE="${{ env.DB_HOST }}"
          MAIN_FINANCE_DB_URL_VALUE="${{ env.MAIN_FINANCE_DB_URL }}"

          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            -o ServerAliveInterval=60 -o ServerAliveCountMax=30 \
            -T \
            "$SSH_USER@$SSH_HOST" "DB_HOST_VALUE='$DB_HOST_VALUE' MAIN_FINANCE_DB_URL_VALUE='$MAIN_FINANCE_DB_URL_VALUE' bash -s" << 'EOF'
          set -euo pipefail
          cd /home/balabantaray-user/kdext

          APP=kdext_manual_anaylizer
          IMAGE=kdext_manual_anaylizer
          PORT=3004

          echo "🔨 Building image on server..."
          docker build -t ${IMAGE}:latest .

          echo "🧹 Removing old container..."
          docker rm -f ${APP} 2>/dev/null || true

          echo "🚀 Starting container..."
          docker run -d --name ${APP} \
            -p ${PORT}:3004 \
            --restart unless-stopped \
            -e NODE_ENV=production \
            -e PORT=3004 \
            -e HOSTNAME=0.0.0.0 \
            -e COOKIE_SECURE=false \
            -e DEXAI_DB_URL="${{ secrets.DEXAI_DB_URL }}" \
            -e MAIN_FINANCE_DB_URL="$MAIN_FINANCE_DB_URL_VALUE" \
            -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -e AWS_BUCKET_NAME="${{ secrets.AWS_BUCKET_NAME }}" \
            -e AWS_REGION="${{ secrets.AWS_REGION }}" \
            -e DB_HOST="$DB_HOST_VALUE" \
            -e DB_PORT=5005 \
            -e DB_NAME=financedb \
            -e DB_USER=financedb_user \
            -e DB_PASSWORD=financedb_password_2026 \
            ${IMAGE}:latest

          echo "⏳ Health check..."
          for i in $(seq 1 60); do
            if curl -fs http://localhost:${PORT}/api/health >/dev/null 2>&1 || \
               curl -fs http://localhost:${PORT} >/dev/null 2>&1; then
              echo "✅ Healthy"
              exit 0
            fi
            sleep 5
          done
          echo "❌ App did not become ready"
          docker logs ${APP} | tail -100 || true
          exit 1
          EOF
