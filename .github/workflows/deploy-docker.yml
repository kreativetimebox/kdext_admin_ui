name: Deploy

# SSH into the EC2 host, upload the source tree, build the Docker image there,
# and swap the running container.
on:
  push:
    branches:
      - production_h200
  workflow_dispatch:

env:
  SSH_HOST: 54.66.204.82
  SSH_PORT: "22"
  SSH_USER: ubuntu
  REMOTE_DIR: /home/ubuntu/kdext_admin_ui
  APP_NAME: kdext_manual_anaylizer
  APP_PORT: "3004"
  DB_HOST: 52.57.179.51
  DB_PORT: "5432"
  DB_NAME: postgres
  DB_PASSWORD: AQ1lVaY3lJUHNb3yp655
  MAIN_FINANCE_DB_URL: postgresql://financedb_user:AQ1lVaY3lJUHNb3yp655@kdext-financeai-db-eu.cbg6ooo0qdhf.eu-central-1.rds.amazonaws.com:5432/postgres?sslmode=require
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload code to server
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p $REMOTE_DIR"
          tar czf - \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env*' \
            . | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
                "tar xzf - -C $REMOTE_DIR"

      - name: Build & restart
        run: |
          DB_HOST_VALUE="${{ env.DB_HOST }}"
          DB_PORT_VALUE="${{ env.DB_PORT }}"
          DB_NAME_VALUE="${{ env.DB_NAME }}"
          DB_PASSWORD_VALUE="${{ env.DB_PASSWORD }}"
          MAIN_FINANCE_DB_URL_VALUE="${{ env.MAIN_FINANCE_DB_URL }}"
          # Same broker as the Gateway — used to publish document.corrected on HITL publish.
          RABBITMQ_URL_VALUE="${{ secrets.RABBITMQ_URL }}"

          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
            -o ServerAliveInterval=60 -o ServerAliveCountMax=30 \
            -T \
            "$SSH_USER@$SSH_HOST" "REMOTE_DIR='${{ env.REMOTE_DIR }}' DB_HOST_VALUE='$DB_HOST_VALUE' DB_PORT_VALUE='$DB_PORT_VALUE' DB_NAME_VALUE='$DB_NAME_VALUE' DB_PASSWORD_VALUE='$DB_PASSWORD_VALUE' MAIN_FINANCE_DB_URL_VALUE='$MAIN_FINANCE_DB_URL_VALUE' RABBITMQ_URL_VALUE='$RABBITMQ_URL_VALUE' bash -s" << 'EOF'
          set -euo pipefail
          cd "$REMOTE_DIR"

          APP=kdext_manual_anaylizer
          IMAGE=kdext_manual_anaylizer
          PORT=3004

          echo "🔨 Building image on server..."
          # BuildKit is required for the Dockerfile's cache mounts (npm + .next/cache).
          DOCKER_BUILDKIT=1 docker build -t ${IMAGE}:latest .

          echo "🧹 Removing old container..."
          docker rm -f ${APP} 2>/dev/null || true

          echo "🚀 Starting container..."
          docker run -d --name ${APP} \
            -p ${PORT}:3004 \
            --restart unless-stopped \
            -e NODE_ENV=production \
            -e PORT=3004 \
            -e HOSTNAME=0.0.0.0 \
            -e COOKIE_SECURE=false \
            -e DEXAI_DB_URL="${{ secrets.DEXAI_DB_URL }}" \
            -e MAIN_FINANCE_DB_URL="$MAIN_FINANCE_DB_URL_VALUE" \
            -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -e AWS_BUCKET_NAME="${{ secrets.AWS_BUCKET_NAME }}" \
            -e AWS_REGION="${{ secrets.AWS_REGION }}" \
            -e AWS_LEGACY_BUCKET_NAME="${{ secrets.AWS_LEGACY_BUCKET_NAME }}" \
            -e AWS_LEGACY_REGION="${{ secrets.AWS_LEGACY_REGION }}" \
            -e AWS_LEGACY_ACCESS_KEY_ID="${{ secrets.AWS_LEGACY_ACCESS_KEY_ID }}" \
            -e AWS_LEGACY_SECRET_ACCESS_KEY="${{ secrets.AWS_LEGACY_SECRET_ACCESS_KEY }}" \
            -e DB_HOST="$DB_HOST_VALUE" \
            -e DB_PORT="$DB_PORT_VALUE" \
            -e DB_NAME="$DB_NAME_VALUE" \
            -e DB_USER=financedb_user \
            -e DB_PASSWORD="$DB_PASSWORD_VALUE" \
            -e RABBITMQ_URL="$RABBITMQ_URL_VALUE" \
            -e RABBITMQ_EVENTS_EXCHANGE="document.events" \
            -e QWEN_SERVICE_URL="http://217.16.188.48:8007" \
            -e ALERT_WATCHED_CONTAINERS="lightonocr,kdext-qwen,kdext-document-api,kdext-api,kdext-worker,kdext-webhook-worker" \
            ${IMAGE}:latest

          echo "⏳ Health check..."
          for i in $(seq 1 60); do
            if curl -fs http://localhost:${PORT}/api/health >/dev/null 2>&1 || \
               curl -fs http://localhost:${PORT} >/dev/null 2>&1; then
              echo "✅ Healthy"
              # Each deploy orphans the previous deps/builder layers.
              docker image prune -f >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 5
          done
          echo "❌ App did not become ready"
          docker logs ${APP} | tail -100 || true
          exit 1
          EOF
